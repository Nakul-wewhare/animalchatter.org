project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "**/*.qmd"
  resources:
    - "assets/**"

website:
  title: "Animal Chatter"
  site-url: https://animalchatter.org
  description: "Academic website for Nakul Wewhare: animal communication, bioacoustics, vocal learning, and research notes."
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: research/index.qmd
        text: Research
      - href: publications/index.qmd
        text: Publications
      - href: notes/index.qmd
        text: Blog
      - text: Methods
        menu:
          - href: methods/index.qmd
            text: Methods overview
          - href: methods/tools/index.qmd
            text: Open Tools
          - href: methods/resources/index.qmd
            text: Resources
      - href: about/index.qmd
        text: About
    right:
      - icon: envelope
        text: Contact
        href: contact.qmd
      - icon: github
        href: https://github.com/Nakul-wewhare
        aria-label: GitHub
      - text: Scholar
        href: https://scholar.google.com/citations?user=T08iq_UAAAAJ&hl=en
  search: true
  page-footer:
    left: "Animal communication, vocal learning, and social behaviour."
    right: "Built with [Quarto](https://quarto.org) and deployed on GitHub Pages."

format:
  html:
    theme:
      light: [litera, styles.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true
    grid:
      sidebar-width: "250px"
      body-width: "1080px"
      margin-width: "220px"

execute:
  freeze: auto
